name: Verify universal-agent-docs release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release workflow run ID that produced the universal-agent-docs artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')"
          test -n "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install hash-locked validation dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Download canonical release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name universal-agent-docs --dir downloaded

      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          signer="github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for file in             universal-agent-docs.zip             universal-agent-docs.sha256             universal-agent-docs.trust.json             universal-agent-docs.release.json
          do
            gh attestation verify "downloaded/$file"               --repo "$GITHUB_REPOSITORY"               --signer-workflow "$signer"               --source-digest "$SOURCE_SHA"
          done

      - name: Verify detached ZIP checksum
        working-directory: downloaded
        run: sha256sum --check universal-agent-docs.sha256

      - name: Verify canonical distribution and manifests
        run: >-
          python scripts/validate.py
          --distribution downloaded/universal-agent-docs.zip
          --trusted-manifest downloaded/universal-agent-docs.trust.json
          --release-manifest downloaded/universal-agent-docs.release.json
