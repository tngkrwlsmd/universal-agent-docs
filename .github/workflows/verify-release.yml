name: Verify universal-agent-docs release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release workflow run ID that produced the universal-agent-docs artifact"
        required: true
        type: string
      expected_source_sha:
        description: "Trusted 40-hex source commit SHA expected for that release"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release run identity and trusted source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          case "$EXPECTED_SOURCE_SHA" in
            (*[!0-9a-f]*|'') echo "expected_source_sha must be lowercase hex" >&2; exit 1 ;;
          esac
          test "${#EXPECTED_SOURCE_SHA}" -eq 40
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          source_sha="$(jq -r '.head_sha' <<<"$run_json")"
          source_branch="$(jq -r '.head_branch' <<<"$run_json")"
          workflow_path="$(jq -r '.path' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          event="$(jq -r '.event' <<<"$run_json")"
          test "$workflow_path" = ".github/workflows/release.yml"
          test "$source_branch" = "main"
          test "$event" = "workflow_dispatch"
          test "$conclusion" = "success"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          echo "sha=$EXPECTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install hash-locked validation dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Download canonical release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name universal-agent-docs --dir downloaded

      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          signer="github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for file in \
            universal-agent-docs.zip \
            universal-agent-docs.sha256 \
            universal-agent-docs.trust.json \
            universal-agent-docs.release.json
          do
            gh attestation verify "downloaded/$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-ref refs/heads/main \
              --source-digest "$SOURCE_SHA"
          done

      - name: Verify detached ZIP checksum
        working-directory: downloaded
        run: sha256sum --check universal-agent-docs.sha256

      - name: Verify canonical distribution and manifests
        run: >-
          python scripts/validate.py
          --distribution downloaded/universal-agent-docs.zip
          --trusted-manifest downloaded/universal-agent-docs.trust.json
          --release-manifest downloaded/universal-agent-docs.release.json
