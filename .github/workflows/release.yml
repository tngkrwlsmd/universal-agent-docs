name: Build and attest universal-agent-docs

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical main source
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "${{ github.sha }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependency
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Validate and test
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - name: Build canonical artifacts
        run: python scripts/package.py --output-dir dist
      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/universal-agent-docs.zip
            dist/universal-agent-docs.sha256
            dist/universal-agent-docs.trust.json
            dist/universal-agent-docs.release.json
      - name: Upload canonical artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-agent-docs
          path: |
            dist/universal-agent-docs.zip
            dist/universal-agent-docs.sha256
            dist/universal-agent-docs.trust.json
            dist/universal-agent-docs.release.json
          if-no-files-found: error
