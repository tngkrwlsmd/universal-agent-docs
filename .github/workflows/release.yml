name: Publish immutable versioned universal-agent-docs release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate immutable release identity
        id: release_identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF" = "refs/tags/$TAG"

          python - "$TAG" <<'PY'
          import re
          import sys

          tag = sys.argv[1]
          pattern = re.compile(
              r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-((?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?"
              r"(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )
          if not pattern.fullmatch(tag):
              raise SystemExit(f"release tag is not strict SemVer with v prefix: {tag}")
          PY

          resolved_sha="$(git rev-list -n 1 "$TAG")"
          test "$resolved_sha" = "$SOURCE_SHA"

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

          core_version="${TAG%%+*}"
          prerelease=false
          if [[ "$core_version" == *-* ]]; then
            prerelease=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install validation dependency
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Validate and test
        run: |
          python scripts/generate_policy_reference.py --check
          python scripts/validate.py
          python -m unittest discover -s tests -v
          python scripts/conformance.py
          python scripts/conformance.py --coverage
          node conformance/reference-javascript/runner.mjs
          python scripts/evaluate.py --fail-on-mismatch

      - name: Build canonical source and consumer artifacts
        run: |
          python scripts/package.py --output-dir dist
          python scripts/package_consumer.py --output-dir dist

      - name: Verify released public feature and source example surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-smoke
          mkdir -p release-smoke/source release-smoke/consumer
          python -m zipfile -e dist/universal-agent-docs.zip release-smoke/source
          python -m zipfile -e dist/universal-agent-docs-consumer.zip release-smoke/consumer
          source_root="release-smoke/source/universal-agent-docs"
          policy_root="release-smoke/consumer/universal-agent-docs-consumer/.agent-policy"
          test -f "$source_root/templates/PROJECT.md"
          test -f "$source_root/PROJECT.md"
          cmp "$source_root/templates/PROJECT.md" "$source_root/PROJECT.md"
          test -f "$policy_root/PROJECT.md"
          cmp "$source_root/templates/PROJECT.md" "$policy_root/PROJECT.md"
          test -f "$source_root/examples/consumer-basic/README.md"
          test -f "$source_root/examples/runtime-adapter/README.md"
          test -f "$source_root/examples/runtime-adapter/github_issue_adapter.py"
          test -f "$source_root/examples/extensions/internal-sandbox-artifact.json"
          test -f "$source_root/examples/capabilities/reference-sandbox-artifact-adapter.json"
          test -f "$source_root/evaluation/scenarios.json"
          test -f "$source_root/evaluation/smoke.json"
          test -f "$source_root/evaluation/regression.json"
          test -f "$source_root/conformance/reference-javascript/runner.mjs"
          test -f "$source_root/scripts/evaluate.py"
          test -f "$source_root/scripts/policy_diff.py"
          test -f "$source_root/scripts/benchmark.py"
          test -f "$source_root/tests/test_consumer_example.py"
          test -f "$source_root/tests/test_extensibility.py"
          test -f "$source_root/tests/test_runtime_adapter_example.py"
          test -f "$source_root/tests/test_sandbox_adapter.py"
          test -f "$policy_root/docs/threat-model.md"
          test ! -e "$policy_root/examples"
          if grep -R -F "blob/main/examples/" "$source_root/README.md" "$source_root/docs"; then
            echo "canonical release docs must not depend on mutable main example links" >&2
            exit 1
          fi
          if grep -R -F "blob/main/examples/" "$policy_root/README.md" "$policy_root/docs"; then
            echo "consumer release docs must not depend on mutable main example links" >&2
            exit 1
          fi
          grep -F -- "matching canonical source artifact" "$policy_root/README.md"
          python "$policy_root/scripts/validate.py" --help > release-smoke/help.txt
          grep -F -- "--compiled-policy" release-smoke/help.txt
          grep -F -- "--operation-extension" release-smoke/help.txt
          grep -F -- "--adapter-capabilities" release-smoke/help.txt
          test -f "$policy_root/OPERATION_EXTENSION.schema.json"
          test -f "$policy_root/ADAPTER_CAPABILITIES.schema.json"
          test -f "$policy_root/docs/extensions.md"
          test -f "$policy_root/docs/generated-policy-reference.md"
          grep -F -- "OPERATION_EXTENSION.schema.json" "$source_root/conformance/README.md"
          grep -F -- "ADAPTER_CAPABILITIES.schema.json" "$source_root/conformance/README.md"
      - name: Upload canonical source artifacts for workflow retention
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-agent-docs
          path: |
            dist/universal-agent-docs.zip
            dist/universal-agent-docs.sha256
            dist/universal-agent-docs.trust.json
            dist/universal-agent-docs.release.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload canonical consumer artifacts for workflow retention
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-agent-docs-consumer
          path: |
            dist/universal-agent-docs-consumer.zip
            dist/universal-agent-docs-consumer.sha256
            dist/universal-agent-docs-consumer.release.json
          if-no-files-found: error
          retention-days: 1

      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/universal-agent-docs.zip
            dist/universal-agent-docs.sha256
            dist/universal-agent-docs.trust.json
            dist/universal-agent-docs.release.json
            dist/universal-agent-docs-consumer.zip
            dist/universal-agent-docs-consumer.sha256
            dist/universal-agent-docs-consumer.release.json

      - name: Verify build provenance before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.release_identity.outputs.source_sha }}
        run: >-
          python scripts/release/verify_release.py
          --mode provenance
          --repo "$GITHUB_REPOSITORY"
          --tag "$TAG"
          --source-sha "$SOURCE_SHA"
          --asset-dir dist

      - name: Inspect existing immutable release
        id: existing_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.release_identity.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.immutable' <<<"$release_json")" = "true"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$SOURCE_SHA"

          for file in \
            universal-agent-docs.zip \
            universal-agent-docs.sha256 \
            universal-agent-docs.trust.json \
            universal-agent-docs.release.json \
            universal-agent-docs-consumer.zip \
            universal-agent-docs-consumer.sha256 \
            universal-agent-docs-consumer.release.json
          do
            local_digest="sha256:$(sha256sum "dist/$file" | awk '{print $1}')"
            remote_digest="$(jq -r --arg name "$file" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            if [[ -z "$remote_digest" || "$remote_digest" == "null" ]]; then
              echo "existing immutable release is missing asset: $file" >&2
              exit 1
            fi
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "existing immutable release asset digest mismatch: $file" >&2
              exit 1
            fi
          done

          echo "existing immutable release exactly matches tag/source/assets; publication will be skipped"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with canonical assets
        if: steps.existing_release.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.release_identity.outputs.source_sha }}
          PRERELEASE: ${{ steps.release_identity.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release create "$TAG"
            dist/universal-agent-docs.zip
            dist/universal-agent-docs.sha256
            dist/universal-agent-docs.trust.json
            dist/universal-agent-docs.release.json
            dist/universal-agent-docs-consumer.zip
            dist/universal-agent-docs-consumer.sha256
            dist/universal-agent-docs-consumer.release.json
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --target "$SOURCE_SHA"
            --title "$TAG"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

  verify:
    name: verify published release
    needs: publish
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install hash-locked validation dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Download exact immutable release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.immutable' <<<"$release_json")" = "true"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$SOURCE_SHA"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded

      - name: Verify release attestation and build provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python scripts/release/verify_release.py
          --mode all
          --repo "$GITHUB_REPOSITORY"
          --tag "$TAG"
          --source-sha "$SOURCE_SHA"
          --asset-dir downloaded

      - name: Verify detached ZIP checksums
        working-directory: downloaded
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check universal-agent-docs.sha256
          sha256sum --check universal-agent-docs-consumer.sha256

      - name: Verify canonical distributions and manifests
        run: |
          python scripts/validate.py \
            --distribution downloaded/universal-agent-docs.zip \
            --trusted-manifest downloaded/universal-agent-docs.trust.json \
            --release-manifest downloaded/universal-agent-docs.release.json
          python scripts/package_consumer.py \
            --verify downloaded/universal-agent-docs-consumer.zip \
            --release-manifest downloaded/universal-agent-docs-consumer.release.json
