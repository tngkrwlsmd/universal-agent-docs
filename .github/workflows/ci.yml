name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validation dependency
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Validate policy bundle
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical distribution
        run: python scripts/package.py --output-dir dist
      - name: Verify canonical distribution
        run: >-
          python scripts/validate.py
          --distribution dist/universal-agent-docs.zip
          --trusted-manifest dist/universal-agent-docs.trust.json
          --release-manifest dist/universal-agent-docs.release.json
      - name: Build consumer distribution
        run: python scripts/package_consumer.py --output-dir dist
      - name: Verify consumer distribution
        run: >-
          python scripts/package_consumer.py
          --verify dist/universal-agent-docs-consumer.zip
          --release-manifest dist/universal-agent-docs-consumer.release.json
