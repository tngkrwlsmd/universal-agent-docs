name: CI

on:
  push:
    branches:
      - main
      - 'policy/**'
  workflow_dispatch:

concurrency:
  # Keep an explicitly requested manual run independent of pushes.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify branch change impact
    if: ${{ startsWith(github.ref, 'refs/heads/policy/') }}
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.impact.outputs.level }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changes relative to main (fail closed)
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git merge-base HEAD refs/remotes/origin/main)"
          changes="$(git diff --name-status "$base" HEAD)"
          level=docs
          if [[ -z "$changes" ]]; then
            level=code
          else
            while IFS=$'\t' read -r status path remainder; do
              # Deletion, rename and unknown changes must use the code path.
              if [[ "$status" != M && "$status" != A ]]; then
                level=code
                break
              fi
              case "$path" in
                AGENTS.md|POLICIES.md|README.md|docs/*.md) ;;
                *) level=code; break ;;
              esac
            done <<< "$changes"
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Validated impact level: $level"

  quick:
    name: Fast branch checks (Python 3.15)
    needs: classify
    if: ${{ startsWith(github.ref, 'refs/heads/policy/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15"
          cache: pip
      - name: Install hash-locked validation dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Check generated reference, canonical contract and Python regression
        run: |
          python scripts/generate_policy_reference.py --check
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.classify.outputs.level != 'docs' }}
        with:
          node-version: "24"
      - name: Check cross-language contracts, evaluation and distributions for code changes
        if: ${{ needs.classify.outputs.level != 'docs' }}
        run: |
          python scripts/conformance.py
          python scripts/conformance.py --coverage
          node conformance/reference-javascript/runner.mjs
          python scripts/evaluate.py --fail-on-mismatch
          python scripts/package.py --output-dir dist
          python scripts/validate.py --distribution dist/universal-agent-docs.zip --trusted-manifest dist/universal-agent-docs.trust.json --release-manifest dist/universal-agent-docs.release.json
          python scripts/package_consumer.py --output-dir dist
          python scripts/package_consumer.py --verify dist/universal-agent-docs-consumer.zip --release-manifest dist/universal-agent-docs-consumer.release.json

  validate:
    name: ${{ matrix.os }} / Python 3.15
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install validation dependency
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Check generated policy reference
        run: python scripts/generate_policy_reference.py --check
      - name: Validate policy bundle
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run language-neutral conformance suite
        run: python scripts/conformance.py
      - name: Report conformance coverage
        run: python scripts/conformance.py --coverage
      - name: Run independent JavaScript core conformance
        run: node conformance/reference-javascript/runner.mjs
      - name: Run practical evaluation corpus
        run: python scripts/evaluate.py --fail-on-mismatch
      - name: Build canonical distribution
        run: python scripts/package.py --output-dir dist
      - name: Verify canonical distribution
        run: >-
          python scripts/validate.py
          --distribution dist/universal-agent-docs.zip
          --trusted-manifest dist/universal-agent-docs.trust.json
          --release-manifest dist/universal-agent-docs.release.json
      - name: Build consumer distribution
        run: python scripts/package_consumer.py --output-dir dist
      - name: Verify consumer distribution
        run: >-
          python scripts/package_consumer.py
          --verify dist/universal-agent-docs-consumer.zip
          --release-manifest dist/universal-agent-docs-consumer.release.json

  required:
    name: required-ci
    needs: [classify, quick, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the expected validation path to succeed
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            test "$CLASSIFY_RESULT" = "skipped"
            test "$QUICK_RESULT" = "skipped"
            test "$VALIDATE_RESULT" = "success"
          elif [[ "$GITHUB_REF" == refs/heads/policy/* ]]; then
            test "$CLASSIFY_RESULT" = "success"
            test "$QUICK_RESULT" = "success"
            test "$VALIDATE_RESULT" = "skipped"
          else
            echo "Unsupported CI ref: $GITHUB_REF" >&2
            exit 1
          fi
