name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
        exclude:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validation dependency
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Validate policy bundle
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical distribution
        run: python scripts/package.py --output-dir dist
      - name: Verify canonical distribution
        run: >-
          python scripts/validate.py
          --distribution dist/universal-agent-docs.zip
          --trusted-manifest dist/universal-agent-docs.trust.json
          --release-manifest dist/universal-agent-docs.release.json
      - name: Build consumer distribution
        run: python scripts/package_consumer.py --output-dir dist
      - name: Verify consumer distribution
        run: >-
          python scripts/package_consumer.py
          --verify dist/universal-agent-docs-consumer.zip
          --release-manifest dist/universal-agent-docs-consumer.release.json
      - name: Record artifact hashes
        env:
          HASH_FILE: hashes-${{ runner.os }}-${{ matrix.python }}.json
        run: >-
          python -c "import json, os; from pathlib import Path;
          data={'source':Path('dist/universal-agent-docs.sha256').read_text().split()[0],
          'consumer':Path('dist/universal-agent-docs-consumer.sha256').read_text().split()[0]};
          Path(os.environ['HASH_FILE']).write_text(json.dumps(data, sort_keys=True), encoding='utf-8')"
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repro-${{ runner.os }}-${{ matrix.python }}
          path: hashes-${{ runner.os }}-${{ matrix.python }}.json
          if-no-files-found: error

  reproducibility:
    name: ubuntu-latest / Python 3.14
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependency
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Validate policy bundle
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical distribution
        run: python scripts/package.py --output-dir dist
      - name: Verify canonical distribution
        run: >-
          python scripts/validate.py
          --distribution dist/universal-agent-docs.zip
          --trusted-manifest dist/universal-agent-docs.trust.json
          --release-manifest dist/universal-agent-docs.release.json
      - name: Build consumer distribution
        run: python scripts/package_consumer.py --output-dir dist
      - name: Verify consumer distribution
        run: >-
          python scripts/package_consumer.py
          --verify dist/universal-agent-docs-consumer.zip
          --release-manifest dist/universal-agent-docs-consumer.release.json
      - name: Download matrix reproducibility evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: repro-*
          path: repro-inputs
          merge-multiple: true
      - name: Record aggregate-run hashes
        run: >-
          python -c "import json; from pathlib import Path;
          data={'source':Path('dist/universal-agent-docs.sha256').read_text().split()[0],
          'consumer':Path('dist/universal-agent-docs-consumer.sha256').read_text().split()[0]};
          Path('repro-inputs/hashes-Linux-3.14.json').write_text(json.dumps(data, sort_keys=True), encoding='utf-8')"
      - name: Require bit-for-bit cross-platform reproducibility
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("repro-inputs").glob("hashes-*.json"))
          if len(files) != 6:
              raise SystemExit(f"expected 6 reproducibility records, found {len(files)}: {files}")
          records = {path.name: json.loads(path.read_text(encoding="utf-8")) for path in files}
          for key in ("source", "consumer"):
              values = {record[key] for record in records.values()}
              if len(values) != 1:
                  raise SystemExit(f"{key} artifact is not reproducible across CI matrix: {records}")
              print(f"{key} reproducible SHA-256: {next(iter(values))}")
          PY
