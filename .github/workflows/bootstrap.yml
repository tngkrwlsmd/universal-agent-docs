name: Bootstrap universal-agent-docs

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical repository
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .bootstrap/part-11 ]]; then
            echo "Bootstrap payload is already gone; nothing to do."
            exit 0
          fi

          tmp="$(mktemp -d)"
          mkdir -p "$tmp/extract"
          cp .github/workflows/bootstrap.yml "$tmp/bootstrap.yml"

          {
            cat .bootstrap/part-00
            cat .bootstrap/part-01
            head -c 2209 .bootstrap/part-02
            printf 'm'
            tail -c +2210 .bootstrap/part-02
            for p in .bootstrap/part-{03..11}; do
              cat "$p"
            done
          } > "$tmp/payload.b64"

          test "$(wc -c < "$tmp/payload.b64")" -eq 157844
          base64 --decode "$tmp/payload.b64" > "$tmp/universal-agent-docs.zip"
          echo "3f9f3af16240c269c5efd56b5c014a141d29a15a5fccfd58386f4de58bc17e16  $tmp/universal-agent-docs.zip" | sha256sum -c -

          unzip -q "$tmp/universal-agent-docs.zip" -d "$tmp/extract"
          test -d "$tmp/extract/universal-agent-docs"
          test "$(find "$tmp/extract/universal-agent-docs" -type f | wc -l)" -eq 23

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$tmp/extract/universal-agent-docs/." .

          python -m pip install -r requirements.txt
          python scripts/validate.py
          python -m unittest discover -s tests -v

          find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 23

          rm -f .github/workflows/ci.yml .github/workflows/release.yml
          cp "$tmp/bootstrap.yml" .github/workflows/bootstrap.yml
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 22

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish universal-agent-docs"
          git push origin HEAD:main
